[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hackrl"
version = "0.1.0"
description = "Controlled Craftax-Classic environment mutations for exploit-learning research"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "craftax==1.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

